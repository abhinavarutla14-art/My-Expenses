name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: my-expenses/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: my-expenses

      - name: Build Angular app for GitHub Pages
        run: npx ng build --base-href /My-Expenses/
        working-directory: my-expenses

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./my-expenses/dist/my-expenses/browser
